name: Notify blog-gen on post update (LinkedIn reshare)

on:
  push:
    branches: [main]
    paths:
      - '_posts/**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Find changed posts
        id: changed
        run: |
          # list files changed in this push that are _posts/*.md
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FILES=$(ls _posts/*.md 2>/dev/null | tr '\n' ',' | sed 's/,$//')
          else
            FILES=$(git diff --name-only HEAD~1 HEAD | grep '^_posts/' | tr '\n' ',' | sed 's/,$//')
            if [ -z "$FILES" ]; then
              # fallback for squash / force pushes (compare against previous commit if exists)
              FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} 2>/dev/null | grep '^_posts/' | tr '\n' ',' | sed 's/,$//')
            fi
          fi
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          if [ -z "$FILES" ]; then
            echo "No _posts changed"
          else
            echo "Changed: $FILES"
          fi
          # also compute URLs
          URLS=""
          IFS=',' read -ra FS <<< "$FILES"
          for F in "${FS[@]}"; do
            YEAR=$(echo "$F" | sed -E 's/.*\/([0-9]{4})-([0-9]{2})-([0-9]{2})-.*/\1/')
            MONTH=$(echo "$F" | sed -E 's/.*\/([0-9]{4})-([0-9]{2})-([0-9]{2})-.*/\2/')
            DAY=$(echo "$F" | sed -E 's/.*\/([0-9]{4})-([0-9]{2})-([0-9]{2})-.*/\3/')
            SLUG=$(echo "$F" | sed -E 's/.*\/[0-9]{4}-[0-9]{2}-[0-9]{2}-(.*)\.md/\1/')
            if [ -n "$YEAR" ] && [ -n "$SLUG" ]; then
              U="https://rammehta1899.github.io/blog/$YEAR/$MONTH/$DAY/$SLUG/"
              if [ -z "$URLS" ]; then URLS="$U"; else URLS="$URLS,$U"; fi
            fi
          done
          echo "urls=$URLS" >> "$GITHUB_OUTPUT"

      - name: Dispatch to blog-gen for LinkedIn share
        if: steps.changed.outputs.files != ''
        env:
          GH_TOKEN: ${{ secrets.BLOG_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "BLOG_DISPATCH_TOKEN not set — set a PAT with repo scope to rammehta1899/blog-gen as secret BLOG_DISPATCH_TOKEN in this public repo to auto-reshare to LinkedIn"
            echo "You can still manually trigger the LinkedIn reshare from blog-gen: Actions → LinkedIn Share on Blog Update → Run workflow"
            exit 0
          fi
          FILES="${{ steps.changed.outputs.files }}"
          URLS="${{ steps.changed.outputs.urls }}"
          echo "Dispatching files=$FILES urls=$URLS"
          gh api repos/rammehta1899/blog-gen/dispatches             -f event_type=linkedin-post-update             -f client_payload[files]="$FILES"             -f client_payload[urls]="$URLS"             -f client_payload[sha]="${{ github.sha }}"
