<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) - on mobile-width viewports the library is
       lazy-loaded (first interaction, or idle after load) so it stays out
       of the critical rendering path; events fired before it loads are
       queued in dataLayer and flushed when it arrives. -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-GBZBCHDDVD');
    (function () {
      var loaded = false;
      function loadGA() {
        if (loaded) return; loaded = true;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-GBZBCHDDVD';
        document.head.appendChild(s);
      }
      if (window.matchMedia('(max-width: 820px)').matches) {
        ['pointerdown', 'keydown', 'scroll', 'touchstart'].forEach(function (evt) {
          window.addEventListener(evt, loadGA, { once: true, passive: true });
        });
        window.addEventListener('load', function () {
          if ('requestIdleCallback' in window) { requestIdleCallback(loadGA, { timeout: 3000 }); }
          else { setTimeout(loadGA, 2000); }
        });
      } else {
        loadGA();
      }
    })();
  </script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="google-site-verification" content="_DPIXE80OReMBFYcyF6yoQeyXQCsGcnyYdDqgVCsthI" />
  <title>{{ site.title }} · {{ site.tagline }}</title>
  <meta name="description" content="{{ site.description }}">
  {% seo %}
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="{{ '/assets/css/editorial.css' | relative_url }}">
</head>
<body class="editorial">
  <header class="masthead" data-surface="site-chrome">
    <div class="wrap nav">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.data.profile.first_name }} <em>{{ site.data.profile.last_name }}</em></a>
      <nav class="navlinks">
        <a href="{{ '/blog/' | relative_url }}">Blog</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    {{ content }}
    {% include footer.html %}
  </main>
  {% include nav-analytics.html %}
</body>
</html>
